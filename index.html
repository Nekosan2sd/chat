<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal P2P Chat</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  body { margin: 0; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; transition: background 0.5s; background: #000; }
  
  .bg-container { position: fixed; inset: 0; z-index: 0; overflow: hidden; opacity: 0; transition: opacity 0.8s; }
  .bg-container.active { opacity: 1; }

  #bg-space { 
    background: #000; 
    background: radial-gradient(circle at bottom right, #3a005a 0%, #000 70%);
  }
  .star { position: absolute; background: white; border-radius: 50%; opacity: 0; animation: twinkle var(--t) infinite ease-in-out; pointer-events: none; }
  @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }

  #bg-water { 
    background: linear-gradient(to bottom, #113355 0%, #030810 100%); 
  }
  .bubble { 
    position: absolute; background: rgba(255, 255, 255, 0.25); border-radius: 50%; 
    bottom: -10px;
    animation: rise var(--t) infinite linear; 
    pointer-events: none;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    15% { opacity: 0.7; }
    85% { opacity: 0.7; }
    100% { transform: translateY(-110vh) translateX(var(--x)); opacity: 0; }
  }

  #bg-matrix { background: #000; }
  #matrix-canvas { width: 100%; height: 100%; opacity: 0.8; }

  #bg-ocean {
    background: radial-gradient(circle at 50% 0%, #001a33 0%, #00050a 80%);
  }
  .ray {
    position: absolute; top: -50%; left: 50%; width: 200%; height: 200%;
    background: conic-gradient(from 180deg at 50% 0%, transparent 45%, rgba(255,255,255,0.03) 50%, transparent 55%);
    transform-origin: top center;
    animation: sway 15s infinite ease-in-out;
    z-index: 2;
  }
  .snow {
    position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 50%;
    animation: fall var(--t) infinite linear;
    filter: blur(1px);
    z-index: 3;
  }
  .abyss-shadow {
    position: absolute; top: 10%; left: -10%; width: 120%; height: 100%;
    background: radial-gradient(ellipse at center, rgba(0,8,20,0.8) 0%, transparent 60%);
    filter: blur(80px);
    animation: pulse 12s infinite ease-in-out;
    z-index: 1;
  }

  @keyframes sway { 0%, 100% { transform: translateX(-50%) rotate(-5deg); } 50% { transform: translateX(-50%) rotate(5deg); } }
  @keyframes fall { 
    0% { transform: translateY(-20vh) translateX(0); opacity: 0; } 
    20% { opacity: 0.5; }
    80% { opacity: 0.5; }
    100% { transform: translateY(120vh) translateX(40px); opacity: 0; } 
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 0.9; } }

  #login-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .login-box { text-align: center; z-index: 101; }
  
  input { 
    display: block; width: 250px; padding: 12px; margin: 10px auto; 
    border: none; border-radius: 8px; background: rgba(255,255,255,0.06); color: white; outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.3); }
  #login-screen button { padding: 10px 25px; background: rgba(255,255,255,0.12); color: white; border: none; border-radius: 8px; cursor: pointer; }

  #chat-ui { position: fixed; bottom: 70px; left: 30px; width: 350px; display: none; flex-direction: column; z-index: 10; pointer-events: none; }
  
  #chat-box { 
    height: 280px; overflow-y: auto; display: flex; flex-direction: column-reverse; 
    padding: 5px; 
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
    pointer-events: auto;
  }
  #chat-box::-webkit-scrollbar { width: 0; }

  .msg { margin: 5px 0; animation: slideIn 0.3s ease-out; line-height: 1.4; word-wrap: break-word; text-shadow: 0 0 3px rgba(0,0,0,0.5); }
  .msg-name { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-right: 8px; }
  .msg-text { color: white; font-size: 0.95rem; }
  
  .sys-msg { font-size: 0.8rem; color: rgba(255,255,255,0.25); font-style: italic; margin: 5px 0; }

  #input-area { display: flex; gap: 8px; margin-top: 5px; pointer-events: auto; }
  #msg-input { flex: 1; margin: 0; width: auto; background: rgba(255,255,255,0.03); }

  #send-btn, #call-btn { 
    padding: 0 15px; background: none; color: rgba(255,255,255,0.15); 
    border: none; cursor: pointer; font-size: 0.8rem; letter-spacing: 1px;
  }
  #call-btn { color: #55aaff; }

  @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  
  #bg-switcher { position: fixed; bottom: 20px; left: 30px; display: flex; gap: 12px; z-index: 20; opacity: 0.2; transition: opacity 0.3s; }
  #bg-switcher:hover { opacity: 1; }
  .switch-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; transition: transform 0.2s; box-sizing: border-box; }
  .switch-btn.active { border: 2px solid white; transform: scale(1.1); }
  #switch-space { background: #1a002a; }
  #switch-water { background: #113355; }
  #switch-matrix { background: #003300; }
  #switch-ocean { background: #001a33; }
</style>
</head>
<body>

<div id="bg-space" class="bg-container active"></div>
<div id="bg-water" class="bg-container"></div>
<div id="bg-matrix" class="bg-container"><canvas id="matrix-canvas"></canvas></div>
<div id="bg-ocean" class="bg-container">
    <div class="abyss-shadow"></div>
    <div class="ray"></div>
</div>

<div id="login-screen">
  <div class="login-box">
    <h1 style="font-weight: lighter; letter-spacing: 8px; color: rgba(255,255,255,0.5); margin-bottom: 40px;">CHAT</h1>
    <input type="text" id="room-num" placeholder="ROOM ID">
    <input type="text" id="user-name" placeholder="NAME">
    <button onclick="initP2P()">CONNECT</button>
  </div>
</div>

<div id="chat-ui">
  <div id="chat-box"></div>
  <div id="input-area">
    <input type="text" id="msg-input" placeholder="Message">
    <button id="send-btn" onclick="send()">SEND</button>
    <button id="call-btn" onclick="toggleCall()">CALL</button>
  </div>
</div>

<div id="bg-switcher">
    <div id="switch-space" class="switch-btn active" onclick="setBg('space')"></div>
    <div id="switch-water" class="switch-btn" onclick="setBg('water')"></div>
    <div id="switch-matrix" class="switch-btn" onclick="setBg('matrix')"></div>
    <div id="switch-ocean" class="switch-btn" onclick="setBg('ocean')"></div>
</div>

<script>
  const bgSpace = document.getElementById('bg-space');
  const bgWater = document.getElementById('bg-water');
  const bgOcean = document.getElementById('bg-ocean');
  const switcherBtns = document.querySelectorAll('.switch-btn');

  for (let i = 0; i < 250; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 'px';
    star.style.width = star.style.height = size;
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.setProperty('--t', (Math.random() * 3 + 2) + 's');
    star.style.animationDelay = Math.random() * 5 + 's';
    bgSpace.appendChild(star);
  }

  for (let i = 0; i < 40; i++) { 
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = (Math.random() * 6 + 2.5) + 'px'; 
    bubble.style.width = bubble.style.height = size;
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.setProperty('--t', (Math.random() * 13 + 12) + 's'); 
    bubble.style.setProperty('--x', (Math.random() * 40 - 20) + 'px');
    bubble.style.animationDelay = Math.random() * 15 + 's';
    bgWater.appendChild(bubble);
  }

  for (let i = 0; i < 80; i++) {
    const snow = document.createElement('div');
    snow.className = 'snow';
    const size = Math.random() * 4 + 2 + 'px';
    snow.style.width = snow.style.height = size;
    snow.style.left = Math.random() * 100 + '%';
    snow.style.top = '-' + (Math.random() * 20) + '%';
    snow.style.setProperty('--t', (Math.random() * 15 + 8) + 's');
    snow.style.animationDelay = Math.random() * 15 + 's';
    bgOcean.appendChild(snow);
  }

  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  let columns = Math.floor(width / 20);
  let drops = [];
  for(let i=0; i<columns; i++) drops[i] = 1;

  function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'; 
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = '#00ff00'; 
    ctx.font = '15px monospace';
    for(let i=0; i<drops.length; i++) {
        const text = String.fromCharCode(Math.random() * 128);
        ctx.fillText(text, i*20, drops[i]*20);
        if(drops[i]*20 > height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
  }
  let matrixInterval = null;

  function setBg(type) {
    const containers = document.querySelectorAll('.bg-container');
    containers.forEach(c => c.classList.remove('active'));
    switcherBtns.forEach(b => b.classList.remove('active'));
    document.getElementById('bg-'+type).classList.add('active');
    document.getElementById('switch-'+type).classList.add('active');
    if(type === 'matrix') {
        if(!matrixInterval) matrixInterval = setInterval(drawMatrix, 50);
    } else {
        if(matrixInterval) { clearInterval(matrixInterval); matrixInterval = null; }
    }
  }
  
  window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / 20);
      drops = [];
      for(let i=0; i<columns; i++) drops[i] = 1;
  });

  let peer, connections = [], myName, roomID, isHost = false, localStream;

  function initP2P() {
    roomID = document.getElementById('room-num').value;
    myName = document.getElementById('user-name').value;
    if(!roomID || !myName) return;
    const hostID = "SPACE-ROOM-" + roomID;
    peer = new Peer(hostID);
    peer.on('open', () => {
      isHost = true;
      startChat();
    });
    peer.on('error', (err) => {
      if(err.type === 'unavailable-id') {
        peer = new Peer();
        peer.on('open', () => {
          isHost = false;
          startChat();
          setupConn(peer.connect(hostID));
        });
      }
    });
    peer.on('connection', setupConn);
    
    peer.on('call', call => {
      if (confirm("着信があります。")) {
        navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
          localStream = stream;
          call.answer(stream);
          setupCall(call);
        });
      }
    });
  }

  function startChat() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-ui').style.display = 'flex';
    document.getElementById('msg-input').onkeydown = (e) => { if(e.key === 'Enter') send(); };
  }

  function setupConn(c) {
    c.on('open', () => {
      if(!connections.find(x => x.peer === c.peer)) {
          connections.push(c);
      }
    });
    c.on('data', data => {
      if(data.type === 'chat') addLog(data.name, data.msg);
      if(isHost) broadcast(data, c.peer);
    });
    c.on('close', () => { connections = connections.filter(x => x.peer !== c.peer); });
  }

  async function toggleCall() {
    if(localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
        return;
    }
    localStream = await navigator.mediaDevices.getUserMedia({audio: true});
    connections.forEach(conn => {
        const call = peer.call(conn.peer, localStream);
        setupCall(call);
    });
  }

  function setupCall(call) {
    call.on('stream', remoteStream => {
      const audio = new Audio();
      audio.srcObject = remoteStream;
      audio.play();
    });
  }

  function broadcast(data, skipPeer) {
    connections.forEach(conn => { if(conn.open && conn.peer !== skipPeer) conn.send(data); });
  }

  function send() {
    const input = document.getElementById('msg-input');
    if(!input.value) return;
    const data = { type: 'chat', name: myName, msg: input.value };
    broadcast(data);
    addLog("YOU", input.value);
    input.value = '';
  }

  function addLog(name, text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = `<span class="msg-name">${name}</span><span class="msg-text">${text}</span>`;
    box.insertBefore(div, box.firstChild);
  }
</script>
</body>
</html>
