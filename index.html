<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal P2P Chat</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  body { margin: 0; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; transition: background 0.5s; background: #000; }
  
  .bg-container { position: fixed; inset: 0; z-index: 0; overflow: hidden; opacity: 0; transition: opacity 0.8s; }
  .bg-container.active { opacity: 1; }

  #bg-space { 
    background: #000; 
    background: radial-gradient(circle at bottom right, #3a005a 0%, #000 70%);
  }
  .star { position: absolute; background: white; border-radius: 50%; opacity: 0; animation: twinkle var(--t) infinite ease-in-out; pointer-events: none; }
  @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }

  #bg-water { 
    background: linear-gradient(to bottom, #113355 0%, #030810 100%); 
  }
  .bubble { 
    position: absolute; background: rgba(255, 255, 255, 0.25); border-radius: 50%; 
    bottom: -10px;
    animation: rise var(--t) infinite linear; 
    pointer-events: none;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    15% { opacity: 0.7; }
    85% { opacity: 0.7; }
    100% { transform: translateY(-110vh) translateX(var(--x)); opacity: 0; }
  }

  #bg-matrix { background: #000; }
  #matrix-canvas { width: 100%; height: 100%; opacity: 0.8; }

  #bg-ocean {
    background: radial-gradient(circle at 50% 0%, #001a33 0%, #00050a 80%);
  }
  .ray {
    position: absolute; top: -50%; left: 50%; width: 200%; height: 200%;
    background: conic-gradient(from 180deg at 50% 0%, transparent 45%, rgba(255,255,255,0.03) 50%, transparent 55%);
    transform-origin: top center;
    animation: sway 15s infinite ease-in-out;
    z-index: 2;
  }
  .snow {
    position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 50%;
    animation: fall var(--t) infinite linear;
    filter: blur(1px);
    z-index: 3;
  }
  .abyss-shadow {
    position: absolute; top: 10%; left: -10%; width: 120%; height: 100%;
    background: radial-gradient(ellipse at center, rgba(0,8,20,0.8) 0%, transparent 60%);
    filter: blur(80px);
    animation: pulse 12s infinite ease-in-out;
    z-index: 1;
  }

  @keyframes sway { 0%, 100% { transform: translateX(-50%) rotate(-5deg); } 50% { transform: translateX(-50%) rotate(5deg); } }
  @keyframes fall { 
    0% { transform: translateY(-20vh) translateX(0); opacity: 0; } 
    20% { opacity: 0.5; }
    80% { opacity: 0.5; }
    100% { transform: translateY(120vh) translateX(40px); opacity: 0; } 
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 0.9; } }

  #login-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .login-box { text-align: center; z-index: 101; }
  
  input { 
    display: block; width: 250px; padding: 12px; margin: 10px auto; 
    border: none; border-radius: 8px; background: rgba(255,255,255,0.06); color: white; outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.3); }
  #login-screen button { padding: 10px 25px; background: rgba(255,255,255,0.12); color: white; border: none; border-radius: 8px; cursor: pointer; }

  #chat-ui { position: fixed; bottom: 70px; left: 30px; width: 350px; display: none; flex-direction: column; z-index: 10; pointer-events: none; }
  
  #chat-box { 
    height: 280px; overflow-y: auto; display: flex; flex-direction: column; 
    padding: 5px; 
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
    pointer-events: auto;
  }
  #chat-box::-webkit-scrollbar { width: 0; }

  .msg { margin: 5px 0; animation: slideIn 0.3s ease-out; line-height: 1.4; word-wrap: break-word; text-shadow: 0 0 3px rgba(0,0,0,0.5); }
  .msg-name { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-right: 8px; }
  .msg-text { color: white; font-size: 0.95rem; }
  
  .sys-msg { font-size: 0.8rem; color: rgba(255,255,255,0.25); font-style: italic; margin: 5px 0; }

  #input-area { display: flex; gap: 8px; margin-top: 5px; pointer-events: auto; }
  #msg-input { flex: 1; margin: 0; width: auto; background: rgba(255,255,255,0.03); }

  #send-btn { 
    padding: 0 15px; background: none; color: rgba(255,255,255,0.15); 
    border: none; cursor: pointer; font-size: 0.8rem; letter-spacing: 1px;
  }

  @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  
  #bg-switcher { position: fixed; bottom: 20px; left: 30px; display: flex; gap: 12px; z-index: 20; opacity: 0.2; transition: opacity 0.3s; }
  #bg-switcher:hover { opacity: 1; }
  .switch-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; transition: transform 0.2s; box-sizing: border-box; }
  .switch-btn.active { border: 2px solid white; transform: scale(1.1); }
  #switch-space { background: #1a002a; }
  #switch-water { background: #113355; }
  #switch-matrix { background: #003300; }
  #switch-ocean { background: #001a33; }

  /* 履歴同期試験版: 追加UI */
  #room-status { position: fixed; top: 16px; right: 18px; z-index: 30; padding: 8px 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; background: rgba(0,0,0,0.25); backdrop-filter: blur(8px); color: rgba(255,255,255,0.65); font-size: 12px; pointer-events: none; }
  #room-status strong { color: white; font-weight: 500; }
  @media (max-width: 600px) {
    #chat-ui { left: 14px; right: 14px; width: auto; bottom: 64px; }
    #room-status { top: 10px; right: 10px; }
  }

  /* パニックキー: 右矢印で即時非表示 */
  #panic-screen { position: fixed; inset: 0; z-index: 99999; display: none; background: #fff; color: #111; font-family: system-ui, sans-serif; }
  body.panic-mode #panic-screen { display: block; }
  body.panic-mode > :not(#panic-screen) { visibility: hidden !important; }

  /* 実用化アップデート */
  #top-panel { position:fixed; top:14px; left:18px; z-index:31; display:none; gap:8px; align-items:flex-start; }
  #connection-badge { padding:8px 11px; border-radius:10px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(8px); font-size:12px; color:#ddd; }
  #connection-badge::before { content:''; display:inline-block; width:7px; height:7px; margin-right:7px; border-radius:50%; background:#ffb020; box-shadow:0 0 8px currentColor; }
  #connection-badge.online::before { background:#35dd88; } #connection-badge.offline::before { background:#ff5d6c; }
  #users-panel { width:180px; max-height:210px; overflow:auto; padding:10px; border-radius:12px; background:rgba(0,0,0,.42); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(10px); }
  #users-title { font-size:11px; color:rgba(255,255,255,.48); margin-bottom:7px; }
  .user-row { display:flex; align-items:center; gap:7px; padding:5px 3px; font-size:12px; color:rgba(255,255,255,.8); }
  .user-dot { width:7px; height:7px; border-radius:50%; background:#35dd88; flex:none; }
  #chat-toolbar { pointer-events:auto; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  #room-label { font-size:11px; color:rgba(255,255,255,.45); }
  .tool-btn { border:0; border-radius:7px; padding:5px 8px; color:rgba(255,255,255,.55); background:rgba(255,255,255,.06); cursor:pointer; }
  .msg { max-width:85%; padding:8px 10px; border-radius:12px; background:rgba(255,255,255,.07); align-self:flex-start; }
  .msg.own { align-self:flex-end; background:rgba(59,130,246,.28); text-align:right; }
  .msg.pending { opacity:.62; } .msg.failed { outline:1px solid #ff5d6c; cursor:pointer; }
  .msg-meta { display:block; margin-top:3px; font-size:10px; color:rgba(255,255,255,.35); }
  #unread-badge { display:none; position:absolute; right:5px; bottom:54px; pointer-events:auto; border:0; border-radius:20px; padding:7px 11px; color:white; background:#2563eb; cursor:pointer; box-shadow:0 4px 18px rgba(0,0,0,.3); }
  #msg-input:disabled, #send-btn:disabled { opacity:.45; cursor:not-allowed; }
  #send-btn { min-width:58px; border-radius:8px; background:rgba(255,255,255,.08); }
  @media (max-width:600px) { #top-panel{left:10px;top:10px} #users-panel{display:none} #chat-box{height:48vh} input{font-size:16px} }

  /* 操作安定化: iPadの入力ズームとチャットの上下振動を防止 */
  #msg-input { font-size: 16px !important; min-width: 0; }
  #chat-box { overflow-anchor: none; scroll-behavior: auto; overscroll-behavior: contain; }
  .msg { flex: 0 0 auto; contain: layout style; }
  #input-area { width: 100%; box-sizing: border-box; }
  #send-btn { flex: 0 0 auto; }
</style>
</head>
<body>
<div id="panic-screen" aria-hidden="true"></div>

<div id="bg-space" class="bg-container active"></div>
<div id="bg-water" class="bg-container"></div>
<div id="bg-matrix" class="bg-container"><canvas id="matrix-canvas"></canvas></div>
<div id="bg-ocean" class="bg-container">
    <div class="abyss-shadow"></div>
    <div class="ray"></div>
</div>

<div id="login-screen">
  <div class="login-box">
    <h1 style="font-weight: lighter; letter-spacing: 8px; color: rgba(255,255,255,0.5); margin-bottom: 40px;">CHAT</h1>
    <input type="text" id="room-num" placeholder="ROOM ID">
    <input type="text" id="user-name" placeholder="NAME">
    <button onclick="initP2P()">CONNECT</button>
  </div>
</div>

<div id="top-panel"><div id="connection-badge">接続準備中</div><div id="users-panel"><div id="users-title">オンライン</div><div id="users-list"></div></div></div>
<div id="room-status" style="display:none"><strong id="online-count">1</strong> online · 履歴20件</div>
<div id="chat-ui">
  <div id="chat-toolbar"><span id="room-label"></span><button class="tool-btn" onclick="clearHistory()">履歴削除</button></div>
  <div id="chat-box"></div>
  <button id="unread-badge" onclick="showLatest()">新着 0件</button>
  <div id="input-area">
    <input type="text" id="msg-input" placeholder="Message">
    <button id="send-btn" onclick="send()">SEND</button>
  </div>
</div>

<div id="bg-switcher">
    <div id="switch-space" class="switch-btn active" onclick="setBg('space')"></div>
    <div id="switch-water" class="switch-btn" onclick="setBg('water')"></div>
    <div id="switch-matrix" class="switch-btn" onclick="setBg('matrix')"></div>
    <div id="switch-ocean" class="switch-btn" onclick="setBg('ocean')"></div>
</div>

<script>
  const bgSpace = document.getElementById('bg-space');
  const bgWater = document.getElementById('bg-water');
  const bgOcean = document.getElementById('bg-ocean');
  const switcherBtns = document.querySelectorAll('.switch-btn');

  for (let i = 0; i < 250; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 'px';
    star.style.width = star.style.height = size;
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.setProperty('--t', (Math.random() * 3 + 2) + 's');
    star.style.animationDelay = Math.random() * 5 + 's';
    bgSpace.appendChild(star);
  }

  for (let i = 0; i < 40; i++) { 
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = (Math.random() * 6 + 2.5) + 'px'; 
    bubble.style.width = bubble.style.height = size;
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.setProperty('--t', (Math.random() * 13 + 12) + 's'); 
    bubble.style.setProperty('--x', (Math.random() * 40 - 20) + 'px');
    bubble.style.animationDelay = Math.random() * 15 + 's';
    bgWater.appendChild(bubble);
  }

  for (let i = 0; i < 80; i++) {
    const snow = document.createElement('div');
    snow.className = 'snow';
    const size = Math.random() * 4 + 2 + 'px';
    snow.style.width = snow.style.height = size;
    snow.style.left = Math.random() * 100 + '%';
    snow.style.top = '-' + (Math.random() * 20) + '%';
    snow.style.setProperty('--t', (Math.random() * 15 + 8) + 's');
    snow.style.animationDelay = Math.random() * 15 + 's';
    bgOcean.appendChild(snow);
  }

  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  let columns = Math.floor(width / 20);
  let drops = [];
  for(let i=0; i<columns; i++) drops[i] = 1;

  function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'; 
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = '#00ff00'; 
    ctx.font = '15px monospace';
    for(let i=0; i<drops.length; i++) {
        const text = String.fromCharCode(Math.random() * 128);
        ctx.fillText(text, i*20, drops[i]*20);
        if(drops[i]*20 > height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
  }
  let matrixInterval = null;

  function setBg(type) {
    const containers = document.querySelectorAll('.bg-container');
    containers.forEach(c => c.classList.remove('active'));
    switcherBtns.forEach(b => b.classList.remove('active'));
    document.getElementById('bg-'+type).classList.add('active');
    document.getElementById('switch-'+type).classList.add('active');
    if(type === 'matrix') {
        if(!matrixInterval) matrixInterval = setInterval(drawMatrix, 50);
    } else {
        if(matrixInterval) { clearInterval(matrixInterval); matrixInterval = null; }
    }
  }
  
  window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / 20);
      drops = [];
      for(let i=0; i<columns; i++) drops[i] = 1;
  });

  let peer, connections = [], myName, roomID, isHost = false;
  let roomState = { messages: [], users: {} };
  const HISTORY_LIMIT = 20;
  const JOURNAL_LIMIT = 200;
  let messageJournal = [];
  let hostSequence = 0;
  let activeHostLinkToken = 0;
  let chatReady = false;
  let scrollFrame = 0;
  let lastRenderedSignature = '';
  let seenMessageIds = new Set();
  let hostID = '';
  let hostConnection = null;
  let migrationRunning = false;
  let reconnectTimer = null;
  let connectionState = 'connecting';
  let pendingMessages = new Map();
  let sendQueue = [];
  let unreadCount = 0;
  let retryTimer = null;
  let pageVisible = !document.hidden;
  let migrationRound = 0;
  let migrationTimer = null;
  let recoveryWatchdog = null;
  let recoveryStartedAt = 0;
  let consecutiveRecoveryFailures = 0;
  const MAX_PENDING_AGE = 24 * 60 * 60 * 1000;
  const clientId = sessionStorage.getItem('p2p-client-id') ||
    (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
  sessionStorage.setItem('p2p-client-id', clientId);
  const electionScore = Number(sessionStorage.getItem('p2p-election-score')) || Math.random();
  sessionStorage.setItem('p2p-election-score', String(electionScore));

  function storageKey() { return 'minimal-p2p-chat:' + roomID; }

  function messageOrderValue(m) {
    // 表示位置は作成時刻で固定する。ACKや再接続でhostSeqが付いても飛ばさない。
    return Number(m.time || m.receivedAt || 0);
  }

  function normalizeMessage(m) {
    if (!isValidMessage(m)) return null;
    return {...m, receivedAt:Number(m.receivedAt || m.time || Date.now())};
  }

  function mergeMessages(...groups) {
    const byId = new Map();
    groups.flat().forEach(raw => {
      const m=normalizeMessage(raw); if(!m) return;
      const prev=byId.get(m.id);
      if(!prev || (Number.isFinite(m.hostSeq) && !Number.isFinite(prev.hostSeq)) ||
        Number(m.receivedAt||0) > Number(prev.receivedAt||0)) byId.set(m.id,m);
    });
    return [...byId.values()].sort((a,b) => messageOrderValue(a)-messageOrderValue(b) || a.id.localeCompare(b.id));
  }

  function safeLoadHistory() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey()) || '[]');
      messageJournal = Array.isArray(saved) ? mergeMessages(saved).slice(-JOURNAL_LIMIT) : [];
      return messageJournal.slice(-HISTORY_LIMIT);
    } catch (e) { console.warn('履歴の読み込みに失敗:', e); messageJournal=[]; return []; }
  }

  function saveHistory() {
    try {
      messageJournal = mergeMessages(messageJournal, roomState.messages).slice(-JOURNAL_LIMIT);
      localStorage.setItem(storageKey(), JSON.stringify(messageJournal));
    } catch (e) { console.warn('履歴の保存に失敗:', e); }
  }

  function isValidMessage(data) {
    return data && data.type === 'chat' && typeof data.id === 'string' &&
      typeof data.name === 'string' && typeof data.msg === 'string' && Number.isFinite(data.time);
  }

  function addMessageToState(data) {
    const normalized=normalizeMessage(data);
    if (!normalized) return false;
    const existed=seenMessageIds.has(normalized.id);
    messageJournal=mergeMessages(messageJournal,[normalized]).slice(-JOURNAL_LIMIT);
    roomState.messages=messageJournal.slice(-HISTORY_LIMIT);
    seenMessageIds=new Set(roomState.messages.map(m=>m.id));
    saveHistory();
    return !existed;
  }

  function myUserRecord(host = false) {
    return { clientId, name: myName.slice(0, 40), score: electionScore, host, updatedAt: Date.now() };
  }

  function outboxKey() { return 'practical-chat-outbox:' + roomID; }

  function persistOutbox() {
    try {
      const rows = [...pendingMessages.values()].map(item => ({
        data: item.data, attempts: item.attempts, lastSent: item.lastSent, queuedAt: item.queuedAt || Date.now()
      })).filter(item => Date.now() - item.queuedAt < MAX_PENDING_AGE);
      localStorage.setItem(outboxKey(), JSON.stringify(rows));
    } catch (e) { console.warn('送信待ち保存失敗:', e); }
  }

  function restoreOutbox() {
    try {
      const rows = JSON.parse(localStorage.getItem(outboxKey()) || '[]');
      if (!Array.isArray(rows)) return;
      rows.forEach(item => {
        if (!item || !isValidMessage(item.data)) return;
        if (Date.now() - Number(item.queuedAt || 0) >= MAX_PENDING_AGE) return;
        pendingMessages.set(item.data.id, {
          data: item.data, attempts: Number(item.attempts || 0), lastSent: 0, queuedAt: Number(item.queuedAt || Date.now())
        });
        if (!seenMessageIds.has(item.data.id)) addMessageToState(item.data);
        sendQueue.push(item.data.id);
      });
    } catch (e) { console.warn('送信待ち復元失敗:', e); }
  }

  function startRecoveryWatchdog() {
    clearInterval(recoveryWatchdog);
    recoveryStartedAt = Date.now();
    recoveryWatchdog = setInterval(() => {
      if (isHost || (hostConnection && hostConnection.open)) {
        consecutiveRecoveryFailures = 0;
        recoveryStartedAt = 0;
        clearInterval(recoveryWatchdog);
        recoveryWatchdog = null;
        flushQueue();
        return;
      }
      const elapsed = Date.now() - recoveryStartedAt;
      if (elapsed > 30000) {
        recoveryStartedAt = Date.now();
        consecutiveRecoveryFailures++;
        migrationRunning = false;
        migrationRound++;
        safelyDestroyPeer(false);
        setConnectionState('connecting', '復旧を再試行中 ' + consecutiveRecoveryFailures);
        if (navigator.onLine) createRecoveryPeer();
      }
    }, 2000);
  }

  function createRecoveryPeer() {
    if (!navigator.onLine || isHost) return;
    peer = new Peer();
    bindPeerBaseEvents(peer);
    let opened = false;
    const openTimeout = setTimeout(() => {
      if (!opened) { safelyDestroyPeer(false); beginHostMigration(true); }
    }, 6000);
    peer.on('open', () => {
      opened = true;
      clearTimeout(openTimeout);
      migrationRunning = false;
      startChat();
      connectToHost(0);
    });
    peer.on('error', () => {
      clearTimeout(openTimeout);
      safelyDestroyPeer(false);
      setTimeout(() => beginHostMigration(true), 800 + Math.random() * 800);
    });
  }

  function initP2P() {
    roomID = document.getElementById('room-num').value.trim();
    myName = document.getElementById('user-name').value.trim();
    localStorage.setItem('practical-chat-room', roomID);
    localStorage.setItem('practical-chat-name', myName);
    if (!roomID || !myName) return;
    hostID = 'SPACE-ROOM-' + roomID;
    roomState.messages = safeLoadHistory();
    seenMessageIds = new Set(roomState.messages.map(m => m.id));
    restoreOutbox();
    createInitialPeer();
  }

  function createInitialPeer() {
    peer = new Peer(hostID);
    bindPeerBaseEvents(peer);
    peer.on('open', () => becomeHost(false));
    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        safelyDestroyPeer();
        createClientPeer();
      } else if (!migrationRunning) {
        addSystemLog('接続エラー: ' + (err.type || 'unknown'));
      }
    });
  }

  function createClientPeer() {
    peer = new Peer();
    bindPeerBaseEvents(peer);
    peer.on('open', () => {
      isHost = false;
      startChat();
      renderHistory();
      connectToHost();
    });
    peer.on('error', err => {
      if (err.type !== 'peer-unavailable' && err.type !== 'network')
        addSystemLog('接続エラー: ' + (err.type || 'unknown'));
    });
  }

  function bindPeerBaseEvents(targetPeer) {
    targetPeer.on('connection', setupConn);
  }

  function connectToHost(attempt = 0) {
    clearTimeout(reconnectTimer);
    if (!recoveryWatchdog) startRecoveryWatchdog();
    if (!peer || peer.destroyed || isHost) return;
    if (attempt >= 5) {
      beginHostMigration(true);
      return;
    }
    setConnectionState('connecting', attempt ? '再接続中 ' + attempt : '接続中');
    if (attempt === 0) addSystemLog('ホストへ接続しています…');
    const c = peer.connect(hostID, { reliable: true });
    hostConnection = c;
    const linkToken=++activeHostLinkToken;
    c.__hostLinkToken=linkToken;
    setupConn(c, true);
    const timeout = Math.min(1400 + attempt * 650, 4200);
    reconnectTimer = setTimeout(() => {
      if (!isHost && (!hostConnection || !hostConnection.open)) connectToHost(attempt + 1);
    }, timeout);
  }

  function becomeHost(migrated) {
    isHost = true;
    chatReady=true;
    setConnectionState('online', '接続済み・ホスト');
    migrationRunning = false;
    clearTimeout(migrationTimer);
    clearTimeout(reconnectTimer);
    clearInterval(recoveryWatchdog); recoveryWatchdog = null; recoveryStartedAt = 0; consecutiveRecoveryFailures = 0;
    hostConnection = null;
    connections = [];
    Object.values(roomState.users).forEach(u => u.host = false);
    roomState.users[clientId] = myUserRecord(true);
    hostSequence=Math.max(0,...messageJournal.map(m=>Number(m.hostSeq)||0));
    startChat(); renderHistory(); updateStatus();
    addSystemLog(migrated ? 'ホストを引き継ぎました。' : 'この端末がホストです。');
  }

  function startChat() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-ui').style.display = 'flex';
    document.getElementById('room-status').style.display = 'block';
    document.getElementById('top-panel').style.display = 'flex';
    document.getElementById('room-label').textContent = 'ROOM ' + roomID;
    document.getElementById('msg-input').onkeydown = e => { if (e.key === 'Enter') send(); };
  }

  function setupConn(c, isHostLink = false) {
    if (!c || c.__configured) return;
    c.__configured = true;
    c.on('open', () => {
      if (isHostLink && !isHost && c !== hostConnection) { try{c.close();}catch(_){} return; }
      if (!connections.includes(c)) connections.push(c);
      if (isHostLink || !isHost) {
        setConnectionState('online', isHost ? '接続済み・ホスト' : '同期確認中');
        chatReady=isHost;
        migrationRunning = false;
        clearTimeout(migrationTimer);
        clearInterval(recoveryWatchdog); recoveryWatchdog = null; recoveryStartedAt = 0; consecutiveRecoveryFailures = 0;
      }
      if (isHostLink) hostConnection = c;
      c.send({ type: 'hello', user: myUserRecord(isHost) });
      if (isHost) sendFullState(c);
      updateStatus();
    });

    c.on('data', data => {
      if (isHostLink && !isHost && (c !== hostConnection || c.__hostLinkToken !== activeHostLinkToken)) return;
      if (!data || typeof data.type !== 'string') return;
      if (data.type === 'hello' && isHost && validUser(data.user)) {
        roomState.users[data.user.clientId] = {...data.user, peerId: c.peer, host: false, updatedAt: Date.now()};
        addSystemLog(data.user.name + ' が入室しました。');
        // 履歴を含む完全状態は、新しく入った端末だけへ送る。
        sendFullState(c);
        // 既存参加者へは軽量な在室一覧だけを送る。再描画・再同期はさせない。
        broadcastPresence(c.peer);
      } else if (data.type === 'state' && !isHost) {
        applyState(data.state);
      } else if (data.type === 'presence' && !isHost && data.users && typeof data.users === 'object') {
        roomState.users = data.users;
        roomState.users[clientId] = myUserRecord(false);
        updateStatus();
      } else if (data.type === 'chat' && isValidMessage(data)) {
        if (isHost && !Number.isFinite(data.hostSeq)) {
          data.hostSeq=++hostSequence; data.receivedAt=Date.now();
        }
        if (addMessageToState(data)) {
          const followLatest=isNearLatest();
          addLog(data.name, data.msg, data.time, data.id, false, 'delivered', followLatest);
          if(!followLatest) showUnreadInsideChat();
          handleUnread();
        }
        if(isHost){broadcast(data,c.peer);try{c.send({type:'ack',id:data.id,hostSeq:data.hostSeq});}catch(_){}}
        else{try{c.send({type:'ack',id:data.id});}catch(_){}}
      } else if (data.type === 'ack' && typeof data.id === 'string') {
        const waiting=pendingMessages.get(data.id);
        if(waiting&&Number.isFinite(data.hostSeq)){
          waiting.data.hostSeq=data.hostSeq;
          waiting.data.receivedAt=Date.now();
          messageJournal=mergeMessages(messageJournal,[waiting.data]).slice(-JOURNAL_LIMIT);
          saveHistory();
        }
        markDelivered(data.id);
      }
    });

    c.on('close', () => handleConnectionClosed(c, isHostLink));
    c.on('error', () => handleConnectionClosed(c, isHostLink));
  }

  function validUser(u) {
    return u && typeof u.clientId === 'string' && typeof u.name === 'string' && Number.isFinite(u.score);
  }

  function handleConnectionClosed(c, isHostLink) {
    if (c.__closedHandled) return;
    if (isHostLink && !isHost && (c !== hostConnection || c.__hostLinkToken !== activeHostLinkToken)) return;
    c.__closedHandled = true;
    connections = connections.filter(x => x !== c);
    if (isHostLink && !isHost) {
      chatReady=false;
      hostConnection = null;
      beginHostMigration();
    } else if (isHost) {
      const entry = Object.values(roomState.users).find(u => u.peerId === c.peer);
      if (entry) { delete roomState.users[entry.clientId]; addSystemLog(entry.name + ' が退出しました。'); }
      broadcastPresence();
    }
    updateStatus();
  }

  function beginHostMigration(force = false) {
    if ((migrationRunning && !force) || isHost) return;
    migrationRunning = true;
    if (!recoveryWatchdog) startRecoveryWatchdog();
    migrationRound++;
    const thisRound = migrationRound;
    clearTimeout(reconnectTimer);
    clearTimeout(migrationTimer);
    setConnectionState('connecting', 'ホスト再選出中');
    addSystemLog(force ? 'ホストに接続できないため再選出します…' : 'ホストが退出しました。再選出します…');

    const candidates = Object.values(roomState.users)
      .filter(u => validUser(u) && !u.host);
    if (!candidates.some(u => u.clientId === clientId)) candidates.push(myUserRecord(false));
    candidates.sort((a, b) => b.score - a.score || a.clientId.localeCompare(b.clientId));
    const rank = Math.max(0, candidates.findIndex(u => u.clientId === clientId));

    // すべての参加者が順位順にホスト取得へ挑戦する。
    // 上位端末がスリープ・切断中でも次順位が引き継げる。
    const delay = 650 + rank * 1250 + Math.floor(Math.random() * 220);
    setConnectionState('connecting', 'ホスト候補 ' + (rank + 1) + '位・待機中');
    migrationTimer = setTimeout(() => {
      if (isHost || thisRound !== migrationRound) return;
      claimHostId(thisRound);
    }, delay);
  }

  function claimHostId(round) {
    if (isHost || round !== migrationRound) return;
    setConnectionState('connecting', 'ホスト引き継ぎ試行中');
    safelyDestroyPeer(false);
    peer = new Peer(hostID);
    bindPeerBaseEvents(peer);
    let finished = false;
    const fallbackTimer = setTimeout(() => {
      if (finished || isHost || round !== migrationRound) return;
      finished = true;
      becomeClientAfterElection(round);
    }, 3500);

    peer.on('open', () => {
      if (finished || round !== migrationRound) return;
      finished = true;
      clearTimeout(fallbackTimer);
      becomeHost(true);
      flushQueue();
    });
    peer.on('error', err => {
      if (finished || round !== migrationRound) return;
      finished = true;
      clearTimeout(fallbackTimer);
      // unavailable-id は別端末が取得済み、その他も一度クライアントとして探索する。
      becomeClientAfterElection(round);
    });
  }

  function becomeClientAfterElection(round) {
    if (isHost || round !== migrationRound) return;
    safelyDestroyPeer(false);
    peer = new Peer();
    bindPeerBaseEvents(peer);
    peer.on('open', () => {
      if (round !== migrationRound || isHost) return;
      migrationRunning = false;
      startChat();
      connectToHost(0);
    });
    peer.on('error', () => {
      if (round !== migrationRound || isHost) return;
      migrationRunning = false;
      migrationTimer = setTimeout(() => beginHostMigration(true), 1200 + Math.random() * 600);
    });
  }

  function safelyDestroyPeer(clearElection = true) {
    chatReady=false;
    clearTimeout(reconnectTimer);
    if (clearElection) clearTimeout(migrationTimer);
    connections.forEach(c => { try { c.close(); } catch (_) {} });
    connections = [];
    try { if (peer && !peer.destroyed) peer.destroy(); } catch (_) {}
  }

  function applyState(state) {
    if (!state || !Array.isArray(state.messages)) return;
    const pending=[...pendingMessages.values()].map(item=>item.data);
    messageJournal=mergeMessages(messageJournal,roomState.messages,state.messages,pending).slice(-JOURNAL_LIMIT);
    roomState.messages=messageJournal.slice(-HISTORY_LIMIT);
    roomState.users=state.users && typeof state.users==='object' ? state.users : {};
    roomState.users[clientId]=myUserRecord(false);
    seenMessageIds=new Set(roomState.messages.map(m=>m.id));
    hostSequence=Math.max(hostSequence,...messageJournal.map(m=>Number(m.hostSeq)||0));
    saveHistory();
    const nextSignature=roomState.messages.map(m=>m.id).join('|');
    if(nextSignature!==lastRenderedSignature) renderHistory();
    updateStatus();
    chatReady=true; setConnectionState('online','接続済み'); flushQueue();
  }

  function sendFullState(target) {
    if (!isHost) return;
    roomState.users[clientId] = myUserRecord(true);
    const data = { type: 'state', state: { messages: roomState.messages, users: roomState.users } };
    if (target && target.open) target.send(data); else broadcast(data);
    updateStatus();
  }

  function broadcastPresence(skipPeer) {
    if (!isHost) return;
    roomState.users[clientId] = myUserRecord(true);
    broadcast({ type:'presence', users:roomState.users }, skipPeer);
    updateStatus();
  }


  function broadcast(data, skipPeer) {
    connections.slice().forEach(c => {
      if (!c || !c.open || c.peer === skipPeer) return;
      try { c.send(data); } catch (_) {}
    });
  }

  function sendChatPacket(data) {
    if (isHost) { broadcast(data); return true; }
    if (!chatReady || !hostConnection || !hostConnection.open) return false;
    try { hostConnection.send(data); return true; } catch (_) { return false; }
  }

  function canSendNow() {
    return Boolean(peer && peer.open && (isHost || (chatReady && hostConnection && hostConnection.open)));
  }

  function send() {
    const input = document.getElementById('msg-input'), text = input.value.trim();
    if (!text) return;
    const data = { type:'chat', id:clientId+'-'+Date.now()+'-'+Math.random().toString(36).slice(2),
      name:myName.slice(0,40), msg:text.slice(0,2000), time:Date.now() };
    if(isHost){data.hostSeq=++hostSequence;data.receivedAt=Date.now();}
    addMessageToState(data);
    addLog('YOU', data.msg, data.time, data.id, true, canSendNow() ? 'sending' : 'queued');
    pendingMessages.set(data.id, {data, attempts:0, lastSent:0, queuedAt:Date.now()});
    persistOutbox();
    if (canSendNow()) transmitPending(data.id); else sendQueue.push(data.id);
    input.value = '';
  }

  function transmitPending(id) {
    const item=pendingMessages.get(id); if(!item || !canSendNow()) return;
    item.attempts++; item.lastSent=Date.now();
    persistOutbox();
    if(!sendChatPacket(item.data)){sendQueue.push(id);updateMessageStatus(id,'接続待ち・復旧後に自動送信','pending');return;}
    updateMessageStatus(id, item.attempts > 1 ? '再送中' : '送信中', 'pending');
    if (isHost) markDelivered(id);
  }

  function flushQueue() {
    const ids=[...new Set([...sendQueue, ...pendingMessages.keys()])]; sendQueue=[];
    ids.forEach(transmitPending);
  }

  function markDelivered(id) {
    if (!pendingMessages.has(id)) return;
    pendingMessages.delete(id);
    persistOutbox();
    updateMessageStatus(id, '配信済み', '');
  }

  function retryPending() {
    const now=Date.now();
    pendingMessages.forEach((item,id) => {
      if (now-item.lastSent < 4000) return;
      if (item.attempts >= 4 && !canSendNow()) {
        updateMessageStatus(id, '接続待ち・復旧後に自動送信', 'pending');
      } else if (item.attempts >= 8) {
        updateMessageStatus(id, '自動再送待ち・タップでも再送可', 'failed');
        item.attempts = 0; item.lastSent = now;
        persistOutbox();
      } else if (canSendNow()) transmitPending(id);
    });
  }

  function retryMessage(id) {
    const item=pendingMessages.get(id); if(!item) return;
    item.attempts=0; item.lastSent=0; transmitPending(id);
  }

  function renderHistory() {
    const box=document.getElementById('chat-box');
    const wasNearLatest=isNearLatest();
    box.textContent='';
    roomState.messages.forEach(m => addLog(m.name,m.msg,m.time,m.id,m.name===myName,'delivered',false));
    lastRenderedSignature=roomState.messages.map(m=>m.id).join('|');
    if(wasNearLatest || box.childElementCount<=HISTORY_LIMIT) scrollToLatest(false);
  }

  function addLog(name,text,time,id='',own=false,status='',autoScroll=true) {
    const box=document.getElementById('chat-box'), div=document.createElement('div');
    div.className='msg'+(own?' own':'')+(status==='queued'||status==='sending'?' pending':'');
    if(id) { div.dataset.messageId=id; div.onclick=()=>div.classList.contains('failed')&&retryMessage(id); }
    const n=document.createElement('span'); n.className='msg-name'; n.textContent=name;
    const t=document.createElement('span'); t.className='msg-text'; t.textContent=text;
    const meta=document.createElement('span'); meta.className='msg-meta';
    meta.textContent=(time?new Date(time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'')+(own&&status?' · '+statusLabel(status):'');
    div.append(n,t,meta); box.appendChild(div);
    if(id && !lastRenderedSignature.split('|').includes(id)) lastRenderedSignature+=(lastRenderedSignature?'|':'')+id;
    if(autoScroll) scrollToLatest(false);
  }

  function statusLabel(s) { return ({queued:'送信待ち',sending:'送信中',delivered:'配信済み'}[s]||s); }
  function updateMessageStatus(id,label,cls) {
    const div=document.querySelector('[data-message-id="'+CSS.escape(id)+'"]'); if(!div)return;
    div.classList.remove('pending','failed'); if(cls)div.classList.add(cls);
    const meta=div.querySelector('.msg-meta'); if(meta) meta.textContent=meta.textContent.split(' · ')[0]+' · '+label;
  }

  function addSystemLog(text) {
    const box=document.getElementById('chat-box'), div=document.createElement('div');
    const follow=isNearLatest(); div.className='sys-msg'; div.textContent=text; box.appendChild(div); if(follow) scrollToLatest(false);
  }

  function setConnectionState(state,label) {
    connectionState=state; const badge=document.getElementById('connection-badge'); if(!badge)return;
    badge.className=state; badge.textContent=label;
    const input=document.getElementById('msg-input');
    const button=document.getElementById('send-btn');
    input.disabled=false; button.disabled=false;
    input.placeholder=state==='online' ? 'Message' : '再接続中でも送信できます';
  }

  function updateStatus() {
    const users=Object.values(roomState.users).filter(validUser);
    document.getElementById('online-count').textContent=String(Math.max(1,users.length));
    const list=document.getElementById('users-list'); if(list){ list.textContent='';
      users.sort((a,b)=>a.name.localeCompare(b.name,'ja')).forEach(u=>{const row=document.createElement('div');row.className='user-row';
        const dot=document.createElement('span');dot.className='user-dot';const name=document.createElement('span');
        name.textContent=u.name+(u.host?' (ホスト)':'')+(u.clientId===clientId?' (自分)':'');row.append(dot,name);list.appendChild(row);}); }
    const status=document.getElementById('room-status'); status.title=isHost?'この端末がホストです':'参加者';
  }

  function isNearLatest() {
    const box=document.getElementById('chat-box');
    return box.scrollHeight - box.scrollTop - box.clientHeight < 70;
  }

  function scrollToLatest(smooth=false) {
    const box=document.getElementById('chat-box');
    if(!box) return;
    cancelAnimationFrame(scrollFrame);
    scrollFrame=requestAnimationFrame(() => {
      box.scrollTop=box.scrollHeight;
    });
  }

  function handleUnread() {
    if(pageVisible) return;
    if(unreadCount===0) unreadCount=1;
    document.title='('+unreadCount+') 新着メッセージ';
    const b=document.getElementById('unread-badge'); b.style.display='block'; b.textContent='新着 '+unreadCount+'件';
  }
  function showUnreadInsideChat() {
    unreadCount++;
    const b=document.getElementById('unread-badge');
    b.style.display='block'; b.textContent='新着 '+unreadCount+'件';
  }
  function showLatest(){ unreadCount=0; document.title='Minimal P2P Chat'; document.getElementById('unread-badge').style.display='none'; scrollToLatest(false); }
  function clearHistory(){ if(!confirm('この部屋の端末内履歴を削除しますか？'))return; roomState.messages=[];messageJournal=[];seenMessageIds.clear();saveHistory();renderHistory();addSystemLog('端末内の履歴を削除しました。'); }

  document.addEventListener('visibilitychange',()=>{
    pageVisible=!document.hidden;
    if(!pageVisible){ saveHistory(); persistOutbox(); return; }
    showLatest();
    // タブ復帰時は表示履歴を消さず、現在の回線だけ検査する。
    const healthy=isHost ? Boolean(peer && peer.open) : Boolean(peer && peer.open && hostConnection && hostConnection.open);
    if(!healthy && navigator.onLine){
      setConnectionState('connecting','タブ復帰・接続確認中');
      if(!isHost){ safelyDestroyPeer(false); createRecoveryPeer(); startRecoveryWatchdog(); }
    } else { flushQueue(); }
  });
  window.addEventListener('online',()=>{
    setConnectionState('connecting','通信復旧中');
    if(!isHost){ safelyDestroyPeer(false); createRecoveryPeer(); startRecoveryWatchdog(); }
  });
  window.addEventListener('offline',()=>{
    setConnectionState('offline','オフライン・送信は保留されます');
    persistOutbox();
  });
  retryTimer=setInterval(retryPending,1000);
  window.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('room-num').value=localStorage.getItem('practical-chat-room')||'';
    document.getElementById('user-name').value=localStorage.getItem('practical-chat-name')||'';
  });

  window.addEventListener('beforeunload', () => {
    persistOutbox();
    clearInterval(retryTimer);
    clearInterval(recoveryWatchdog);
    clearTimeout(migrationTimer);
    safelyDestroyPeer();
  });

// パニックキー: 右矢印キーで画面を白くし、もう一度押すと復帰
  let panicMode = false;
  let panicAudioStates = [];

  function togglePanicMode() {
    panicMode = !panicMode;
    document.body.classList.toggle('panic-mode', panicMode);
    document.getElementById('panic-screen').setAttribute('aria-hidden', String(!panicMode));

    if (panicMode) {
      panicAudioStates = [];
      document.querySelectorAll('audio, video').forEach(media => {
        panicAudioStates.push({ media, wasPaused: media.paused });
        try { media.pause(); } catch (_) {}
      });
      document.title = 'New Tab';
    } else {
      panicAudioStates.forEach(item => {
        if (!item.wasPaused) item.media.play().catch(() => {});
      });
      panicAudioStates = [];
      document.title = 'Minimal P2P Chat';
      const input = document.getElementById('msg-input');
      if (input && document.getElementById('chat-ui').style.display !== 'none') input.focus();
    }
  }

  window.addEventListener('keydown', event => {
    if (event.key !== 'ArrowRight' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
    event.preventDefault();
    event.stopPropagation();
    togglePanicMode();
  }, true);
</script>
</body>
</html>
